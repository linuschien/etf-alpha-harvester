  responses:
    BadRequestError:
      description: 400 Bad Request - Validation Failure
      content:
        application/json:
          schema:
            type: object
            required: [error, message]
            properties:
              error:
                type: string
                example: "VALIDATION_FAILED"
              message:
                type: string
                example: "Invalid parameter format."

    NotFoundError:
      description: 404 Not Found - Target Resource Does Not Exist
      content:
        application/json:
          schema:
            type: object
            required: [error, message]
            properties:
              error:
                type: string
                example: "RESOURCE_NOT_FOUND"
              message:
                type: string
                example: "Target entity ID not found."

    ConflictError:
      description: 409 Conflict - Optimistic Concurrency Locking Failure
      content:
        application/json:
          schema:
            type: object
            required: [error, message, currentVersion]
            properties:
              error:
                type: string
                example: "OPTIMISTIC_LOCKING_FAILURE"
              message:
                type: string
                example: "Resource version mismatch. Reload entity before submitting."
              currentVersion:
                type: integer
                example: 2

    InternalServerError:
      description: 500 Internal Server Error
      content:
        application/json:
          schema:
            type: object
            required: [error, message]
            properties:
              error:
                type: string
                example: "INTERNAL_SERVER_ERROR"
              message:
                type: string
                example: "Unexpected failure occurred during job execution."
