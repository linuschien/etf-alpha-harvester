openapi: 3.2.0
info:
  title: AlphaHarvester - Global Services API
  description: >
    Transportation layer specification for AlphaHarvester Global Market Intelligence and Asset Governance.
    
    Architecture Principles:
    1. Operational Ingress Only: REST transport layer is strictly reserved for Cloud Scheduler / webhook triggers
       (`POST /marketData:sync` and `POST /globalAssetScores:evaluate`).
    2. GraphQL Query Gateway: All domain entity reads (ETFs, benchmarks, historical quotes, FRED macro yields,
       candidate scores, DCA rankings, dividends, and stock splits) are routed exclusively through the GraphQL Gateway (`/graphql`).
    3. Zero Fake CRUD: Eliminates all artificial, unused REST CRUD endpoints. All market data is ingested via automated pipelines.
  version: 3.5.0
servers:
  - url: /api/v1
    description: Production Cloud Run API Gateway

paths:
  # ----------------------------------------------------
  # Unified Market Data Synchronization Pipeline
  # ----------------------------------------------------
  /marketData:sync:
    post:
      summary: Daily batch synchronization of all external market intelligence data
      description: >
        Triggered daily at 08:00 TST by Cloud Scheduler (or on-demand by ops).
        Executes the complete market intelligence data collection pipeline:
        1. Syncs ETF metadata catalog from TWSE (t187ap47_L) and TPEx (tpex_mainboard_quotes).
        2. Syncs daily closing quotes, trading volume, turnover, NAV, and discount/premium percentages.
        3. Syncs 9 global benchmark and volatility indices (^TWII, ^GSPC, ^NDX, ^SOX, ^N225, ^VIX, ^VXN, ^MOVE, FEAR_GREED).
        4. Syncs FRED macroeconomic interest rate yields (US 10Y, 20Y Treasury, Corporate bond yield).
        5. Syncs TWSE monthly Top 20 regular DCA investor popularity rankings (ETFRank).
        6. Syncs ETF dividend distribution schedules and corporate actions (stock splits).
      operationId: syncMarketData
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketDataSyncRequest'
      responses:
        '200':
          description: Full market data synchronization completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketDataSyncResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ----------------------------------------------------
  # Candidate Asset Multi-Factor Scoring Pipeline
  # ----------------------------------------------------
  /globalAssetScores:evaluate:
    post:
      summary: Trigger quantitative multi-factor scoring and candidate ranking
      description: >
        Executes factor evaluation models for candidate ETFs:
        1. Validates hard constraints:
           - Core: TER <= 0.45%, AUM >= 10B TWD
           - Satellite: AUM >= 2B TWD, 30d Avg Turnover >= 20M TWD
           - Defensive: AUM >= 5B TWD, Leverage = 1.0x (no L/R)
        2. Dynamic Core classification via max(R^2) >= 0.95 across 3 benchmarks (^TWII, ^GSPC, ^NDX).
        3. Disqualifies failing candidates immediately (not scored, not ranked, never written to score ledger).
        4. Independently ranks qualified candidates within CandidateAssetClass (CORE, SATELLITE, DEFENSIVE).
        5. Persists pure qualified score snapshots into the GlobalAssetScore ledger.
      operationId: evaluateGlobalAssetScores
      responses:
        '200':
          description: Candidate asset scoring and class ranking completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalAssetScoreEvaluationResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    MarketDataSyncRequest:
      type: object
      properties:
        scope:
          type: string
          enum: [ALL, METADATA, QUOTES, MACRO_YIELDS, DCA_RANKS, DIVIDENDS_AND_SPLITS]
          default: ALL
          example: "ALL"
        evaluateAfterSync:
          type: boolean
          default: true
          example: true

    MarketDataSyncResponse:
      type: object
      required: [status, message, executedAt, syncedRecords]
      properties:
        status:
          type: string
          example: "SUCCESS"
        message:
          type: string
          example: "Market data synchronization completed successfully."
        executedAt:
          type: string
          format: date-time
          example: "2026-09-23T08:00:00Z"
        syncedRecords:
          type: object
          required: [etfAssetsCount, dailyQuotesCount, macroYieldSnapshotsCount, dcaPopularityRanksCount, dividendAnnouncementsCount, corporateActionsCount]
          properties:
            etfAssetsCount:
              type: integer
              example: 389
            dailyQuotesCount:
              type: integer
              example: 398
            macroYieldSnapshotsCount:
              type: integer
              example: 1
            dcaPopularityRanksCount:
              type: integer
              example: 20
            dividendAnnouncementsCount:
              type: integer
              example: 12
            corporateActionsCount:
              type: integer
              example: 1

    GlobalAssetScoreEvaluationResponse:
      type: object
      required: [status, message, executedAt, evaluatedCandidatesCount, coreCount, satelliteCount, defensiveCount]
      properties:
        status:
          type: string
          example: "SUCCESS"
        message:
          type: string
          example: "Candidate asset scoring and class ranking completed successfully."
        executedAt:
          type: string
          format: date-time
          example: "2026-09-23T08:05:00Z"
        evaluatedCandidatesCount:
          type: integer
          example: 389
        coreCount:
          type: integer
          example: 2
        satelliteCount:
          type: integer
          example: 5
        defensiveCount:
          type: integer
          example: 3

  responses:
    BadRequestError:
      description: 400 Bad Request - Validation Failure
      content:
        application/json:
          schema:
            type: object
            required: [error, message]
            properties:
              error:
                type: string
                example: "VALIDATION_FAILED"
              message:
                type: string
                example: "Invalid parameter format."

    InternalServerError:
      description: 500 Internal Server Error
      content:
        application/json:
          schema:
            type: object
            required: [error, message]
            properties:
              error:
                type: string
                example: "INTERNAL_SERVER_ERROR"
              message:
                type: string
                example: "Unexpected failure occurred during pipeline execution."
