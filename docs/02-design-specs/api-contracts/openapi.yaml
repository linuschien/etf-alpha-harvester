openapi: 3.2.0
info:
  title: AlphaHarvester - Global Services API
  description: >
    Transportation layer specification for AlphaHarvester Global Market Intelligence and Asset Governance.
    
    Architecture Principles:
    1. Operational Ingress Only: REST transport layer is strictly reserved for Cloud Scheduler / webhook triggers
       (`POST /marketData:sync` and `POST /globalAssetScores:evaluate`).
    2. GraphQL Query Gateway: All domain entity reads (ETFs, benchmarks, historical quotes, FRED macro yields,
       candidate scores, DCA rankings, dividends, and stock splits) are routed exclusively through the GraphQL Gateway (`/graphql`).
    3. Zero Fake CRUD: Eliminates all artificial, unused REST CRUD endpoints. All market data is ingested via automated pipelines.
  version: 3.5.0
servers:
  - url: /api/v1
    description: Production Cloud Run API Gateway

paths:
  # ----------------------------------------------------
  # Unified Market Data Synchronization Pipeline
  # ----------------------------------------------------
  /marketData:sync:
    post:
      summary: Daily batch synchronization of all external market intelligence data
      description: >
        Triggered daily at 08:00 TST by Cloud Scheduler (or on-demand by ops).
        Executes the complete market intelligence data collection pipeline:
        1. Syncs ETF metadata catalog from TWSE (t187ap47_L) and TPEx (tpex_mainboard_quotes).
        2. Syncs daily closing quotes, trading volume, turnover, NAV, and discount/premium percentages.
        3. Syncs 9 global benchmark and volatility indices (^TWII, ^GSPC, ^NDX, ^SOX, ^N225, ^VIX, ^VXN, ^MOVE, FEAR_GREED).
        4. Syncs FRED macroeconomic interest rate yields (US 10Y, 20Y Treasury, Corporate bond yield).
        5. Syncs TWSE monthly Top 20 regular DCA investor popularity rankings (ETFRank).
        6. Syncs ETF dividend distribution schedules and corporate actions (stock splits).
      operationId: syncMarketData
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketDataSyncRequest'
      responses:
        '200':
          description: Full market data synchronization completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketDataSyncResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ----------------------------------------------------
  # Candidate Asset Multi-Factor Scoring Pipeline
  # ----------------------------------------------------
  /globalAssetScores:evaluate:
    post:
      summary: Trigger quantitative multi-factor scoring and candidate ranking
      description: >
        Executes factor evaluation models for candidate ETFs:
        1. Validates hard gates (Listing days >= 30, R^2 >= 0.95, Total Expense Ratio <= 0.45%, |Discount/Premium| <= 0.5%).
        2. Independently ranks candidates within CandidateAssetClass (CORE, SATELLITE, DEFENSIVE).
        3. Persists point-in-time score snapshots into the GlobalAssetScore ledger.
      operationId: evaluateGlobalAssetScores
      responses:
        '200':
          description: Candidate asset scoring and class ranking completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalAssetScoreEvaluationResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    CandidateAssetClass:
      type: string
      enum: [CORE, SATELLITE, DEFENSIVE]
      example: "CORE"

    CorporateActionType:
      type: string
      enum: [SPLIT, REVERSE_SPLIT]
      example: "SPLIT"

    TaxTag:
      type: string
      enum: [OVERSEAS_76W, DOMESTIC_54C]
      example: "OVERSEAS_76W"

    MarketDataSyncRequest:
      type: object
      properties:
        scope:
          type: string
          enum: [ALL, METADATA, QUOTES, MACRO_YIELDS, DCA_RANKS, DIVIDENDS_AND_SPLITS]
          default: ALL
          example: "ALL"
        evaluateAfterSync:
          type: boolean
          default: true
          example: true

    MarketDataSyncResponse:
      type: object
      required: [status, message, executedAt, syncedRecords]
      properties:
        status:
          type: string
          example: "SUCCESS"
        message:
          type: string
          example: "Market data synchronization completed successfully."
        executedAt:
          type: string
          format: date-time
          example: "2026-09-23T08:00:00Z"
        syncedRecords:
          type: object
          required: [etfAssetsCount, dailyQuotesCount, macroYieldSnapshotsCount, dcaPopularityRanksCount, dividendAnnouncementsCount, corporateActionsCount]
          properties:
            etfAssetsCount:
              type: integer
              example: 389
            dailyQuotesCount:
              type: integer
              example: 398
            macroYieldSnapshotsCount:
              type: integer
              example: 1
            dcaPopularityRanksCount:
              type: integer
              example: 20
            dividendAnnouncementsCount:
              type: integer
              example: 12
            corporateActionsCount:
              type: integer
              example: 1

    GlobalAssetScoreEvaluationResponse:
      type: object
      required: [status, message, executedAt, evaluatedCandidatesCount, coreCount, satelliteCount, defensiveCount]
      properties:
        status:
          type: string
          example: "SUCCESS"
        message:
          type: string
          example: "Candidate asset scoring and class ranking completed successfully."
        executedAt:
          type: string
          format: date-time
          example: "2026-09-23T08:05:00Z"
        evaluatedCandidatesCount:
          type: integer
          example: 389
        coreCount:
          type: integer
          example: 2
        satelliteCount:
          type: integer
          example: 5
        defensiveCount:
          type: integer
          example: 3

    # ----------------------------------------------------
    # Domain Entity Schemas (Read via GraphQL Gateway)
    # ----------------------------------------------------
    GlobalAssetMetadata:
      type: object
      required: [id, ticker, name, listingDate, assetClass, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          example: "a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11"
        ticker:
          type: string
          example: "006208"
        name:
          type: string
          example: "富邦台灣采吉50證券投資信託基金"
        listingDate:
          type: string
          format: date-time
          example: "2012-07-17T00:00:00Z"
        underlyingIndex:
          type: string
          example: "富時臺灣證券交易所臺灣50指數"
        issuer:
          type: string
          example: "富邦投信"
        totalExpenseRatio:
          type: number
          format: decimal
          example: 0.0024
        fundSizeTwd:
          type: number
          format: decimal
          example: 185000000000.00
        assetClass:
          $ref: '#/components/schemas/CandidateAssetClass'
        version:
          type: integer
          example: 1
        createdAt:
          type: string
          format: date-time
          example: "2026-09-23T08:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-09-23T08:00:00Z"

    BenchmarkIndex:
      type: object
      required: [id, ticker, name, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          example: "b1eebc99-9c0b-4ef8-bb6d-6bb9bd380a22"
        ticker:
          type: string
          example: "^VIX"
        name:
          type: string
          example: "CBOE Volatility Index"
        region:
          type: string
          example: "US"
        description:
          type: string
          example: "Market volatility gauge and extreme panic sentiment detector."
        version:
          type: integer
          example: 1
        createdAt:
          type: string
          format: date-time
          example: "2026-09-23T08:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-09-23T08:00:00Z"

    MarketDailyQuote:
      type: object
      required: [id, ticker, tradeDate, closePrice, adjustedClosePrice]
      properties:
        id:
          type: string
          format: uuid
          example: "c2eebc99-9c0b-4ef8-bb6d-6bb9bd380a33"
        assetId:
          type: string
          format: uuid
          nullable: true
          example: "a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11"
        benchmarkId:
          type: string
          format: uuid
          nullable: true
          example: null
        ticker:
          type: string
          example: "0050"
        tradeDate:
          type: string
          format: date-time
          example: "2026-09-23T00:00:00Z"
        openPrice:
          type: number
          format: decimal
          example: 47.1000
        highPrice:
          type: number
          format: decimal
          example: 47.5000
        lowPrice:
          type: number
          format: decimal
          example: 47.0500
        closePrice:
          type: number
          format: decimal
          example: 47.3000
        adjustedClosePrice:
          type: number
          format: decimal
          example: 47.3000
        volumeShares:
          type: integer
          format: int64
          example: 15400000
        tradeValueTwd:
          type: number
          format: decimal
          example: 728420000.00
        netAssetValue:
          type: number
          format: decimal
          example: 47.2800
        discountPremiumPercentage:
          type: number
          format: decimal
          example: 0.0423

    MacroYieldSnapshot:
      type: object
      required: [id, recordDate, usCorporateBondEffectiveYield, us10YearTreasuryYield, us20YearTreasuryYield, yieldSpread10yMinus2y]
      properties:
        id:
          type: string
          format: uuid
          example: "d3eebc99-9c0b-4ef8-bb6d-6bb9bd380a44"
        recordDate:
          type: string
          format: date-time
          example: "2026-09-23T00:00:00Z"
        usCorporateBondEffectiveYield:
          type: number
          format: decimal
          example: 0.0525
        us10YearTreasuryYield:
          type: number
          format: decimal
          example: 0.0415
        us20YearTreasuryYield:
          type: number
          format: decimal
          example: 0.0440
        yieldSpread10yMinus2y:
          type: number
          format: decimal
          example: 0.0025

    GlobalAssetScore:
      type: object
      required: [id, ticker, evaluationDate, assetClass, classRank, compositeScore, isQualified]
      properties:
        id:
          type: string
          format: uuid
          example: "e4eebc99-9c0b-4ef8-bb6d-6bb9bd380a55"
        ticker:
          type: string
          example: "00757"
        evaluationDate:
          type: string
          format: date-time
          example: "2026-06-30T18:00:00Z"
        assetClass:
          $ref: '#/components/schemas/CandidateAssetClass'
        classRank:
          type: integer
          example: 1
        compositeScore:
          type: number
          format: decimal
          example: 94.50
        totalExpenseRatio:
          type: number
          format: decimal
          example: 0.0085
        fundSizeTwd:
          type: number
          format: decimal
          example: 52000000000.00
        isQualified:
          type: boolean
          example: true
        disqualificationReason:
          type: string
          nullable: true
          example: null

    DcaPopularityRank:
      type: object
      required: [id, ticker, rankingYear, rankingMonth, rankPosition, regularInvestorCount]
      properties:
        id:
          type: string
          format: uuid
          example: "f5eebc99-9c0b-4ef8-bb6d-6bb9bd380a66"
        ticker:
          type: string
          example: "0050"
        rankingYear:
          type: integer
          example: 2026
        rankingMonth:
          type: integer
          example: 8
        rankPosition:
          type: integer
          example: 1
        regularInvestorCount:
          type: integer
          example: 1280028

    DividendAnnouncement:
      type: object
      required: [id, ticker, exDate, paymentDate, dividendPerShare, taxTag]
      properties:
        id:
          type: string
          format: uuid
          example: "01eebc99-9c0b-4ef8-bb6d-6bb9bd380a77"
        ticker:
          type: string
          example: "0050"
        exDate:
          type: string
          format: date-time
          example: "2026-07-16T00:00:00Z"
        paymentDate:
          type: string
          format: date-time
          example: "2026-08-08T00:00:00Z"
        dividendPerShare:
          type: number
          format: decimal
          example: 1.2500
        taxTag:
          $ref: '#/components/schemas/TaxTag'

    CorporateAction:
      type: object
      required: [id, ticker, actionType, effectiveDate, splitToShares, splitFromShares]
      properties:
        id:
          type: string
          format: uuid
          example: "12eebc99-9c0b-4ef8-bb6d-6bb9bd380a88"
        ticker:
          type: string
          example: "0050"
        actionType:
          $ref: '#/components/schemas/CorporateActionType'
        effectiveDate:
          type: string
          format: date-time
          example: "2025-06-18T00:00:00Z"
        splitToShares:
          type: integer
          example: 4
        splitFromShares:
          type: integer
          example: 1

  responses:
    BadRequestError:
      description: 400 Bad Request - Validation Failure
      content:
        application/json:
          schema:
            type: object
            required: [error, message]
            properties:
              error:
                type: string
                example: "VALIDATION_FAILED"
              message:
                type: string
                example: "Invalid parameter format."

    NotFoundError:
      description: 404 Not Found - Target Resource Does Not Exist
      content:
        application/json:
          schema:
            type: object
            required: [error, message]
            properties:
              error:
                type: string
                example: "RESOURCE_NOT_FOUND"
              message:
                type: string
                example: "Target entity ID not found."

    InternalServerError:
      description: 500 Internal Server Error
      content:
        application/json:
          schema:
            type: object
            required: [error, message]
            properties:
              error:
                type: string
                example: "INTERNAL_SERVER_ERROR"
              message:
                type: string
                example: "Unexpected failure occurred during pipeline execution."
