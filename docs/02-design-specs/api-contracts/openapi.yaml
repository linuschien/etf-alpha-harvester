openapi: 3.2.0
info:
  title: AlphaHarvester - Global Services API
  description: >
    Transportation layer specification for AlphaHarvester Global Market Intelligence and Asset Governance.
    Enforces Collection GET bans (GraphQL gateway redirection), optimistic concurrency locking (409 Conflict),
    and strictly formatted camelCase parameters.
  version: 3.4.0
servers:
  - url: /api/v1
    description: Production Cloud Run API Gateway

paths:
  # ----------------------------------------------------
  # Global Asset Metadata Resource
  # ----------------------------------------------------
  /globalAssets:
    post:
      summary: Register a new ETF asset metadata entry
      operationId: createGlobalAsset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalAssetMetadataRequest'
      responses:
        '201':
          description: ETF metadata entry successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalAssetMetadataResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
    get:
      summary: List ETF asset metadata entries (Deprecated to GraphQL)
      operationId: listGlobalAssets
      deprecated: true
      description: >
        Collection GET queries are deprecated in the REST transport layer.
        Please route all collection listing and multi-attribute filtering requests to the GraphQL Resolver gateway.
      responses:
        '200':
          description: Collection response redirected to GraphQL
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GlobalAssetMetadataResponse'

  /globalAssets/{assetId}:
    parameters:
      - name: assetId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: "a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11"
    get:
      summary: Retrieve single ETF metadata by UUID
      operationId: getGlobalAssetById
      responses:
        '200':
          description: Successful single-resource lookup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalAssetMetadataResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      summary: Replace ETF metadata entry (Idempotent sync)
      operationId: updateGlobalAsset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalAssetMetadataRequest'
      responses:
        '200':
          description: Successfully replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalAssetMetadataResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
    patch:
      summary: Partially update ETF metadata
      operationId: patchGlobalAsset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalAssetMetadataPatchRequest'
      responses:
        '200':
          description: Successfully patched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalAssetMetadataResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
    delete:
      summary: Soft delete an ETF metadata entry
      operationId: deleteGlobalAsset
      responses:
        '204':
          description: Successfully deleted
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ----------------------------------------------------
  # Benchmark Indices Resource
  # ----------------------------------------------------
  /benchmarkIndices:
    post:
      summary: Register a global benchmark or sentiment index
      operationId: createBenchmarkIndex
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BenchmarkIndexRequest'
      responses:
        '201':
          description: Benchmark index created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenchmarkIndexResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
    get:
      summary: List benchmark indices (Deprecated to GraphQL)
      operationId: listBenchmarkIndices
      deprecated: true
      description: Route collection queries to GraphQL Resolver gateway.
      responses:
        '200':
          description: GraphQL redirection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BenchmarkIndexResponse'

  /benchmarkIndices/{benchmarkId}:
    parameters:
      - name: benchmarkId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: "b1eebc99-9c0b-4ef8-bb6d-6bb9bd380a22"
    get:
      summary: Retrieve single benchmark index by UUID
      operationId: getBenchmarkIndexById
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenchmarkIndexResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      summary: Update benchmark index
      operationId: updateBenchmarkIndex
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BenchmarkIndexRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenchmarkIndexResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
    delete:
      summary: Delete benchmark index
      operationId: deleteBenchmarkIndex
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ----------------------------------------------------
  # Market Daily Quotes Resource
  # ----------------------------------------------------
  /marketDailyQuotes:
    post:
      summary: Ingest a daily market quote record
      operationId: createMarketDailyQuote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketDailyQuoteRequest'
      responses:
        '201':
          description: Quote ingested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketDailyQuoteResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
    get:
      summary: List daily quotes (Deprecated to GraphQL)
      operationId: listMarketDailyQuotes
      deprecated: true
      description: Route time-series and filtered collection queries to GraphQL Resolver gateway.
      responses:
        '200':
          description: GraphQL redirection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarketDailyQuoteResponse'

  /marketDailyQuotes/{quoteId}:
    parameters:
      - name: quoteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: "c2eebc99-9c0b-4ef8-bb6d-6bb9bd380a33"
    get:
      summary: Retrieve single daily quote
      operationId: getMarketDailyQuoteById
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketDailyQuoteResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      summary: Delete a daily quote record
      operationId: deleteMarketDailyQuote
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ----------------------------------------------------
  # Macro Yield Snapshot Resource
  # ----------------------------------------------------
  /macroYieldSnapshots:
    post:
      summary: Record daily FRED macro yield data
      operationId: createMacroYieldSnapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MacroYieldSnapshotRequest'
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MacroYieldSnapshotResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
    get:
      summary: List macro yield snapshots (Deprecated to GraphQL)
      operationId: listMacroYieldSnapshots
      deprecated: true
      description: Route to GraphQL Resolver gateway.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MacroYieldSnapshotResponse'

  /macroYieldSnapshots/{snapshotId}:
    parameters:
      - name: snapshotId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: "d3eebc99-9c0b-4ef8-bb6d-6bb9bd380a44"
    get:
      summary: Retrieve single macro yield snapshot
      operationId: getMacroYieldSnapshotById
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MacroYieldSnapshotResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      summary: Delete macro yield snapshot
      operationId: deleteMacroYieldSnapshot
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ----------------------------------------------------
  # Global Asset Score Resource
  # ----------------------------------------------------
  /globalAssetScores:
    post:
      summary: Persist calculated candidate score and class rank
      operationId: createGlobalAssetScore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalAssetScoreRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalAssetScoreResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
    get:
      summary: List asset scores (Deprecated to GraphQL)
      operationId: listGlobalAssetScores
      deprecated: true
      description: Route to GraphQL Resolver gateway for class filtering and sorting.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GlobalAssetScoreResponse'

  /globalAssetScores/{scoreId}:
    parameters:
      - name: scoreId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: "e4eebc99-9c0b-4ef8-bb6d-6bb9bd380a55"
    get:
      summary: Retrieve single asset score
      operationId: getGlobalAssetScoreById
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalAssetScoreResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      summary: Delete asset score
      operationId: deleteGlobalAssetScore
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ----------------------------------------------------
  # DCA Popularity Rank Resource
  # ----------------------------------------------------
  /dcaPopularityRanks:
    post:
      summary: Register or ingest monthly DCA popularity rank
      operationId: createDcaPopularityRank
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DcaPopularityRankRequest'
      responses:
        '201':
          description: DCA rank created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DcaPopularityRankResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
    get:
      summary: List DCA popularity ranks (Deprecated to GraphQL)
      operationId: listDcaPopularityRanks
      deprecated: true
      description: Route to GraphQL Resolver gateway.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DcaPopularityRankResponse'

  /dcaPopularityRanks/{rankId}:
    parameters:
      - name: rankId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: "f5eebc99-9c0b-4ef8-bb6d-6bb9bd380a66"
    get:
      summary: Retrieve single DCA popularity rank
      operationId: getDcaPopularityRankById
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DcaPopularityRankResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      summary: Delete DCA popularity rank
      operationId: deleteDcaPopularityRank
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ----------------------------------------------------
  # Dividend Announcement Resource
  # ----------------------------------------------------
  /dividendAnnouncements:
    post:
      summary: Register dividend announcement
      operationId: createDividendAnnouncement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DividendAnnouncementRequest'
      responses:
        '201':
          description: Dividend announcement created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DividendAnnouncementResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
    get:
      summary: List dividend announcements (Deprecated to GraphQL)
      operationId: listDividendAnnouncements
      deprecated: true
      description: Route to GraphQL Resolver gateway.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DividendAnnouncementResponse'

  /dividendAnnouncements/{announcementId}:
    parameters:
      - name: announcementId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: "01eebc99-9c0b-4ef8-bb6d-6bb9bd380a77"
    get:
      summary: Retrieve single dividend announcement
      operationId: getDividendAnnouncementById
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DividendAnnouncementResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      summary: Delete dividend announcement
      operationId: deleteDividendAnnouncement
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ----------------------------------------------------
  # Corporate Action Resource
  # ----------------------------------------------------
  /corporateActions:
    post:
      summary: Record corporate action (e.g. stock split)
      operationId: createCorporateAction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorporateActionRequest'
      responses:
        '201':
          description: Corporate action recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorporateActionResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
    get:
      summary: List corporate actions (Deprecated to GraphQL)
      operationId: listCorporateActions
      deprecated: true
      description: Route to GraphQL Resolver gateway.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CorporateActionResponse'

  /corporateActions/{actionId}:
    parameters:
      - name: actionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: "12eebc99-9c0b-4ef8-bb6d-6bb9bd380a88"
    get:
      summary: Retrieve single corporate action
      operationId: getCorporateActionById
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorporateActionResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      summary: Delete corporate action
      operationId: deleteCorporateAction
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ----------------------------------------------------
  # Automated Batch Jobs (Cloud Scheduler External Triggers)
  # ----------------------------------------------------
  /jobs/syncMarketData:
    post:
      summary: Daily Cloud Scheduler external trigger for quotes and benchmarks
      operationId: triggerSyncMarketDataJob
      responses:
        '200':
          description: Job executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationStatus'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /jobs/syncMacroYield:
    post:
      summary: Daily Cloud Scheduler external trigger for FRED yields
      operationId: triggerSyncMacroYieldJob
      responses:
        '200':
          description: Job executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationStatus'

  /jobs/evaluateUniverse:
    post:
      summary: Trigger factor ranking and score evaluation job
      operationId: triggerEvaluateUniverseJob
      responses:
        '200':
          description: Job executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationStatus'

components:
  schemas:
    CandidateAssetClass:
      type: string
      enum: [CORE, SATELLITE, DEFENSIVE]
      example: "CORE"

    CorporateActionType:
      type: string
      enum: [SPLIT, REVERSE_SPLIT]
      example: "SPLIT"

    TaxTag:
      type: string
      enum: [OVERSEAS_76W, DOMESTIC_54C]
      example: "OVERSEAS_76W"

    OperationStatus:
      type: object
      required: [status, message, executedAt]
      properties:
        status:
          type: string
          example: "SUCCESS"
        message:
          type: string
          example: "Market data synchronization completed successfully."
        executedAt:
          type: string
          format: date-time
          example: "2026-09-23T08:00:00Z"

    GlobalAssetMetadataRequest:
      type: object
      required: [ticker, name, listingDate, assetClass]
      properties:
        ticker:
          type: string
          example: "006208"
        name:
          type: string
          example: "富邦台灣采吉50證券投資信託基金"
        listingDate:
          type: string
          format: date-time
          example: "2012-07-17T00:00:00Z"
        underlyingIndex:
          type: string
          example: "富時臺灣證券交易所臺灣50指數"
        issuer:
          type: string
          example: "富邦投信"
        totalExpenseRatio:
          type: number
          format: decimal
          example: 0.0024
        fundSizeTwd:
          type: number
          format: decimal
          example: 185000000000.00
        assetClass:
          $ref: '#/components/schemas/CandidateAssetClass'

    GlobalAssetMetadataPatchRequest:
      type: object
      properties:
        name:
          type: string
          example: "富邦台灣采吉50證券投資信託基金"
        totalExpenseRatio:
          type: number
          format: decimal
          example: 0.0022
        fundSizeTwd:
          type: number
          format: decimal
          example: 195000000000.00
        assetClass:
          $ref: '#/components/schemas/CandidateAssetClass'

    GlobalAssetMetadataResponse:
      type: object
      required: [id, ticker, name, listingDate, assetClass, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          example: "a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11"
        ticker:
          type: string
          example: "006208"
        name:
          type: string
          example: "富邦台灣采吉50證券投資信託基金"
        listingDate:
          type: string
          format: date-time
          example: "2012-07-17T00:00:00Z"
        underlyingIndex:
          type: string
          example: "富時臺灣證券交易所臺灣50指數"
        issuer:
          type: string
          example: "富邦投信"
        totalExpenseRatio:
          type: number
          format: decimal
          example: 0.0024
        fundSizeTwd:
          type: number
          format: decimal
          example: 185000000000.00
        assetClass:
          $ref: '#/components/schemas/CandidateAssetClass'
        version:
          type: integer
          example: 1
        createdAt:
          type: string
          format: date-time
          example: "2026-09-23T08:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-09-23T08:00:00Z"

    BenchmarkIndexRequest:
      type: object
      required: [ticker, name]
      properties:
        ticker:
          type: string
          example: "^VIX"
        name:
          type: string
          example: "CBOE Volatility Index"
        region:
          type: string
          example: "US"
        description:
          type: string
          example: "Market volatility gauge and extreme panic sentiment detector."

    BenchmarkIndexResponse:
      type: object
      required: [id, ticker, name, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          example: "b1eebc99-9c0b-4ef8-bb6d-6bb9bd380a22"
        ticker:
          type: string
          example: "^VIX"
        name:
          type: string
          example: "CBOE Volatility Index"
        region:
          type: string
          example: "US"
        description:
          type: string
          example: "Market volatility gauge and extreme panic sentiment detector."
        version:
          type: integer
          example: 1
        createdAt:
          type: string
          format: date-time
          example: "2026-09-23T08:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-09-23T08:00:00Z"

    MarketDailyQuoteRequest:
      type: object
      required: [ticker, tradeDate, closePrice, adjustedClosePrice]
      properties:
        assetId:
          type: string
          format: uuid
          nullable: true
          example: "a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11"
        benchmarkId:
          type: string
          format: uuid
          nullable: true
          example: null
        ticker:
          type: string
          example: "0050"
        tradeDate:
          type: string
          format: date-time
          example: "2026-09-23T00:00:00Z"
        openPrice:
          type: number
          format: decimal
          example: 47.1000
        highPrice:
          type: number
          format: decimal
          example: 47.5000
        lowPrice:
          type: number
          format: decimal
          example: 47.0500
        closePrice:
          type: number
          format: decimal
          example: 47.3000
        adjustedClosePrice:
          type: number
          format: decimal
          example: 47.3000
        volumeShares:
          type: integer
          format: int64
          example: 15400000
        tradeValueTwd:
          type: number
          format: decimal
          example: 728420000.00
        netAssetValue:
          type: number
          format: decimal
          example: 47.2800
        discountPremiumPercentage:
          type: number
          format: decimal
          example: 0.0423

    MarketDailyQuoteResponse:
      type: object
      required: [id, ticker, tradeDate, closePrice, adjustedClosePrice]
      properties:
        id:
          type: string
          format: uuid
          example: "c2eebc99-9c0b-4ef8-bb6d-6bb9bd380a33"
        assetId:
          type: string
          format: uuid
          nullable: true
          example: "a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11"
        benchmarkId:
          type: string
          format: uuid
          nullable: true
          example: null
        ticker:
          type: string
          example: "0050"
        tradeDate:
          type: string
          format: date-time
          example: "2026-09-23T00:00:00Z"
        openPrice:
          type: number
          format: decimal
          example: 47.1000
        highPrice:
          type: number
          format: decimal
          example: 47.5000
        lowPrice:
          type: number
          format: decimal
          example: 47.0500
        closePrice:
          type: number
          format: decimal
          example: 47.3000
        adjustedClosePrice:
          type: number
          format: decimal
          example: 47.3000
        volumeShares:
          type: integer
          format: int64
          example: 15400000
        tradeValueTwd:
          type: number
          format: decimal
          example: 728420000.00
        netAssetValue:
          type: number
          format: decimal
          example: 47.2800
        discountPremiumPercentage:
          type: number
          format: decimal
          example: 0.0423

    MacroYieldSnapshotRequest:
      type: object
      required: [recordDate, usCorporateBondEffectiveYield, us10YearTreasuryYield, us20YearTreasuryYield, yieldSpread10yMinus2y]
      properties:
        recordDate:
          type: string
          format: date-time
          example: "2026-09-23T00:00:00Z"
        usCorporateBondEffectiveYield:
          type: number
          format: decimal
          example: 0.0525
        us10YearTreasuryYield:
          type: number
          format: decimal
          example: 0.0415
        us20YearTreasuryYield:
          type: number
          format: decimal
          example: 0.0440
        yieldSpread10yMinus2y:
